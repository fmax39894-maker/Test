<!DOCTYPE html>
<html>
<body>
<h2>Arduino USB Test</h2>

<button onclick="test()">Test USB</button>
<p id="out"></p>

<script>
async function test() {
  if (!("serial" in navigator)) {
    document.getElementById("out").innerText =
      "❌ Web Serial is NOT supported in this browser.";
    return;
  }

  try {
    const port = await navigator.serial.requestPort();
    document.getElementById("out").innerText =
      "✅ Arduino USB device detected!";
  } catch (e) {
    document.getElementById("out").innerText =
      "❌ " + e.message;
  }
}
</script>
</body>
</html>
