<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Learning AI — Ask</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07111f;
  --panel:#0d1a2c;
  --panel2:#111f34;
  --text:#f5f8ff;
  --muted:#91a0b6;
  --line:#263852;
  --accent:#55d6ff;
  --accent2:#8b7cff;
}

body{
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,#16456b55,transparent 30%),
    radial-gradient(circle at 90% 90%,#4a247355,transparent 30%),
    var(--bg);
  overflow:hidden;
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.glow{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.18;
  animation:float 8s ease-in-out infinite alternate;
}

.glow.one{
  background:#27cfff;
  left:-80px;
  top:-80px;
}

.glow.two{
  background:#8866ff;
  right:-80px;
  bottom:-80px;
  animation-delay:2s;
}

@keyframes float{
  from{transform:translate(0,0)}
  to{transform:translate(50px,30px)}
}

/* LIGHTNING */

.lightning{
  position:fixed;
  pointer-events:none;
  z-index:5;
  opacity:.8;
}

.bolt{
  position:absolute;
  width:2px;
  height:120px;
  background:linear-gradient(
    transparent,
    #61e7ff,
    #a78bfa,
    transparent
  );
  filter:drop-shadow(0 0 9px #61e7ff);
  transform:rotate(25deg);
  animation:flash 4s infinite;
}

.bolt:nth-child(1){
  right:25px;
  top:110px;
}

.bolt:nth-child(2){
  left:18px;
  bottom:130px;
  height:90px;
  transform:rotate(-25deg);
  animation-delay:1.5s;
}

.bolt:nth-child(3){
  right:10px;
  bottom:180px;
  height:65px;
  transform:rotate(-18deg);
  animation-delay:2.5s;
}

@keyframes flash{
  0%,75%,100%{
    opacity:0;
  }
  78%{
    opacity:1;
  }
  82%{
    opacity:.15;
  }
  86%{
    opacity:.9;
  }
  90%{
    opacity:0;
  }
}

/* APP */

.app{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  z-index:2;
}

/* HEADER */

header{
  height:72px;
  flex:none;
  display:flex;
  align-items:center;
  padding:10px 18px;
  border-bottom:1px solid #ffffff12;
  background:#07111fd9;
  backdrop-filter:blur(18px);
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo-icon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,#ffffff,#dce8ff);
  font-size:25px;
  box-shadow:0 0 25px #54dfff20;
}

.logo-text strong{
  display:block;
  font-size:18px;
}

.logo-text span{
  color:var(--muted);
  font-size:12px;
}

/* STATUS */

.status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  color:#b9c6d9;
  font-size:13px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#25d366;
  box-shadow:0 0 12px #25d366;
}

.status-dot.error{
  background:#ff5757;
  box-shadow:0 0 12px #ff5757;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 16px 125px;
}

.chat-inner{
  width:min(850px,100%);
  margin:auto;
}

.welcome{
  text-align:center;
  padding:70px 15px 30px;
}

.welcome-icon{
  width:76px;
  height:76px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:24px;
  font-size:42px;
  background:linear-gradient(135deg,#ffffff,#dce8ff);
  box-shadow:
    0 0 35px #4ddfff22,
    0 20px 50px #0005;
}

.welcome h1{
  margin-top:25px;
  font-size:34px;
}

.welcome p{
  color:var(--muted);
  margin-top:9px;
}

/* MESSAGES */

.message{
  display:flex;
  margin-bottom:22px;
  animation:appear .25s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(75%,650px);
  padding:14px 17px;
  border-radius:19px;
  line-height:1.55;
  font-size:16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:linear-gradient(135deg,#28547d,#4a3d91);
  border-bottom-right-radius:6px;
  box-shadow:0 8px 25px #0003;
}

.ai .bubble{
  background:#0d1a2cee;
  border:1px solid var(--line);
  border-bottom-left-radius:6px;
}

/* COPY */

.answer-tools{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.tool-btn{
  border:1px solid var(--line);
  background:#ffffff08;
  color:var(--muted);
  border-radius:9px;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
}

.tool-btn:hover{
  color:white;
  background:#ffffff12;
}

/* TYPING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:12px 15px;
  width:max-content;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
}

.typing span{
  width:6px;
  height:6px;
  background:#8998ad;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  50%{
    transform:translateY(-5px);
    opacity:.4;
  }
}

/* COMPOSER */

.composer-wrap{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:15px 16px 18px;
  background:linear-gradient(
    transparent,
    #07111fee 35%
  );
  z-index:10;
}

.composer{
  width:min(850px,100%);
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:9px;
  background:#0d1a2cf2;
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 15px 50px #0006;
  backdrop-filter:blur(18px);
}

textarea{
  flex:1;
  min-width:0;
  min-height:48px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:13px 12px;
  font:inherit;
  line-height:1.4;
}

textarea::placeholder{
  color:#748399;
}

.send{
  width:48px;
  height:48px;
  flex:none;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#39cfff,#756cff);
  color:white;
  font-size:21px;
  cursor:pointer;
  box-shadow:0 5px 20px #4dbdff33;
}

.send:hover{
  transform:translateY(-1px);
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* ERROR */

.error-box{
  margin:15px auto;
  width:min(850px,100%);
  padding:13px 15px;
  border:1px solid #ff575744;
  background:#ff575711;
  color:#ff9c9c;
  border-radius:12px;
  display:none;
  font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

  header{
    height:64px;
    padding:8px 12px;
  }

  .logo-icon{
    width:40px;
    height:40px;
  }

  .logo-text strong{
    font-size:16px;
  }

  .welcome{
    padding-top:45px;
  }

  .welcome h1{
    font-size:27px;
  }

  .bubble{
    max-width:88%;
    font-size:15px;
  }

  .chat{
    padding-left:11px;
    padding-right:11px;
  }

  .composer-wrap{
    padding:9px;
  }

  .composer{
    border-radius:20px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>

<div class="lightning">
  <div class="bolt"></div>
  <div class="bolt"></div>
  <div class="bolt"></div>
</div>

<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">🧠</div>

    <div class="logo-text">
      <strong>Learning AI</strong>
      <span>Ask anything</span>
    </div>
  </div>

  <div class="status">
    <span id="statusDot" class="status-dot"></span>
    <span id="statusText">Ready</span>
  </div>
</header>

<main id="chat" class="chat">
  <div id="chatInner" class="chat-inner">

    <div id="welcome" class="welcome">
      <div class="welcome-icon">🧠</div>
      <h1>Ask Learning AI</h1>
      <p>Ask a question from the AI's learned knowledge.</p>
    </div>

  </div>
</main>

<div id="errorBox" class="error-box"></div>

<div class="composer-wrap">

  <form id="form" class="composer">

    <textarea
      id="input"
      rows="1"
      placeholder="Ask your question..."
      autocomplete="off"
      spellcheck="true"
    ></textarea>

    <button id="send" class="send" type="submit">
      ➤
    </button>

  </form>

</div>

</div>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
  "https://heart-ai-omega.vercel.app/api/ask";


/* =========================================================
   ELEMENTS
   ========================================================= */

const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const welcome = document.getElementById("welcome");

const errorBox = document.getElementById("errorBox");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");


/* =========================================================
   AUTO RESIZE
   ========================================================= */

input.addEventListener("input", () => {

  input.style.height = "auto";

  input.style.height =
    Math.min(input.scrollHeight,130) + "px";

});


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   BASIC BOLD SUPPORT
   ========================================================= */

function formatAnswer(text){

  let safe = escapeHTML(text);

  safe = safe.replace(
    /\*\*(.+?)\*\*/gs,
    "<strong>$1</strong>"
  );

  return safe;

}


/* =========================================================
   ADD USER MESSAGE
   ========================================================= */

function addUserMessage(text){

  welcome.style.display = "none";

  const wrapper =
    document.createElement("div");

  wrapper.className = "message user";

  wrapper.innerHTML = `
    <div class="bubble">
      ${formatAnswer(text)}
    </div>
  `;

  chatInner.appendChild(wrapper);

  scrollBottom();

}


/* =========================================================
   ADD AI MESSAGE
   ========================================================= */

function addAIMessage(text){

  const wrapper =
    document.createElement("div");

  wrapper.className = "message ai";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML = formatAnswer(text);

  const tools =
    document.createElement("div");

  tools.className = "answer-tools";

  const copy =
    document.createElement("button");

  copy.className = "tool-btn";

  copy.textContent = "📋 Copy";

  copy.onclick = async () => {

    try{

      await navigator.clipboard.writeText(text);

      copy.textContent = "✓ Copied";

      setTimeout(() => {
        copy.textContent = "📋 Copy";
      },1500);

    }catch{

      copy.textContent = "Copy failed";

    }

  };

  tools.appendChild(copy);

  wrapper.appendChild(bubble);
  wrapper.appendChild(tools);

  chatInner.appendChild(wrapper);

  scrollBottom();

}


/* =========================================================
   TYPING
   ========================================================= */

function showTyping(){

  hideTyping();

  const wrapper =
    document.createElement("div");

  wrapper.id = "typingMessage";

  wrapper.className = "message ai";

  wrapper.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chatInner.appendChild(wrapper);

  scrollBottom();

}


function hideTyping(){

  const old =
    document.getElementById("typingMessage");

  if(old) old.remove();

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollBottom(){

  requestAnimationFrame(() => {

    chat.scrollTop = chat.scrollHeight;

  });

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message){

  errorBox.textContent = message;

  errorBox.style.display = "block";

  statusText.textContent = "Connection error";

  statusDot.classList.add("error");

}


function clearError(){

  errorBox.style.display = "none";

  statusText.textContent = "Ready";

  statusDot.classList.remove("error");

}


/* =========================================================
   ASK API
   ========================================================= */

async function askAI(question){

  const response =
    await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        question:question
      })

    });


  let data;

  try{

    data = await response.json();

  }catch{

    throw new Error(
      "The server returned an invalid response."
    );

  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      `API error (${response.status})`
    );

  }


  if(typeof data.answer !== "string"){

    throw new Error(
      "The API did not return an answer."
    );

  }


  return data.answer;

}


/* =========================================================
   SEND
   ========================================================= */

form.addEventListener("submit",async event => {

  event.preventDefault();

  const question =
    input.value.trim();

  if(!question || send.disabled)
    return;


  clearError();

  addUserMessage(question);

  input.value = "";

  input.style.height = "auto";

  send.disabled = true;

  statusText.textContent = "Thinking...";

  showTyping();


  try{

    const answer =
      await askAI(question);

    hideTyping();

    addAIMessage(answer);

    statusText.textContent = "Online";

  }catch(error){

    hideTyping();

    showError(
      error.message ||
      "Unable to connect to Learning AI."
    );

  }finally{

    send.disabled = false;

    input.focus();

  }

});


/* =========================================================
   ENTER TO SEND
   SHIFT + ENTER = NEW LINE
   ========================================================= */

input.addEventListener("keydown",event => {

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    form.requestSubmit();

  }

});


/* =========================================================
   INITIAL STATUS TEST
   ========================================================= */

async function testConnection(){

  try{

    /*
      We don't send a fake question here because
      /api/ask is designed for POST questions.
      The status simply starts as Ready.
    */

    statusText.textContent = "Online";

  }catch{

    statusText.textContent = "Offline";

    statusDot.classList.add("error");

  }

}


testConnection();

input.focus();

</script>

</body>
</html>
